# learn-eng-pwa-battle — the realtime battle Worker for the GitHub Pages app
# (learn-eng-pwa). Pages Functions can BIND to a Durable Object but cannot
# define one, so the BattleRoom class lives in this small companion Worker.
# The rooms verify tokens against learn_eng_pwa_db, the database of the
# learn-eng-pwa-api project, which reaches this Worker over a service
# binding (functions/ws/[[path]].js) — its workers.dev name is never public.
# Nothing shared with the Cloudflare app's eng-pwa-battle (eng-math-app repo).
#
# Deploy:  scripts/deploy-api.sh   (or: cd battle-worker && npx wrangler@3 deploy)
name = "learn-eng-pwa-battle"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "BATTLE_ROOM"
class_name = "BattleRoom"

[[durable_objects.bindings]]
name = "GHOST_OFFERING_ROOM"
class_name = "GhostOfferingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GhostOfferingRoom"]

[[d1_databases]]
binding = "DB"
database_name = "learn_eng_pwa_db"
database_id = "ce4cd2ee-b75c-458d-94b1-f51e5f4a20d0"
