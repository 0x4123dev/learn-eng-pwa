# learn-eng-pwa-battle — the realtime battle Worker for the GitHub Pages app.
# Same code as eng-pwa-battle (wrangler.toml), a different Worker on a
# different database: the rooms verify tokens against learn_eng_pwa_db, the
# database of the learn-eng-pwa-api project. Nothing shared with eng-pwa.
#
# Deploy:  cd battle-worker && npx wrangler@3 deploy --config wrangler.learn-eng-pwa.toml
name = "learn-eng-pwa-battle"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "BATTLE_ROOM"
class_name = "BattleRoom"

[[durable_objects.bindings]]
name = "GHOST_OFFERING_ROOM"
class_name = "GhostOfferingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GhostOfferingRoom"]

[[d1_databases]]
binding = "DB"
database_name = "learn_eng_pwa_db"
database_id = "ce4cd2ee-b75c-458d-94b1-f51e5f4a20d0"
