# Cloudflare Pages config for the `eng-pwa` project.
# Static assets are staged into ./.cf-dist (generated), Functions live in ./functions,
# and D1 is bound as env.DB. Deploy with: npx wrangler@3 pages deploy
name = "eng-pwa"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./.cf-dist"

[[d1_databases]]
binding = "DB"
database_name = "eng_pwa_db"
database_id = "58c86de1-6992-4bb5-9978-1df06a3036ce"
