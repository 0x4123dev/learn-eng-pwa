<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Night Raid Phaser integration</title><style>*{box-sizing:border-box}body{margin:0;background:#071326;color:#fff;font:700 14px system-ui}.wrap{width:min(820px,100%);margin:auto;padding:10px}.stage{width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#dcefc8}.stage canvas{width:100%!important;height:100%!important;display:block}.bar{display:flex;gap:8px;align-items:center;padding:10px 0}button{min-height:46px;border:2px solid #ffe07c;border-radius:14px;padding:0 18px;background:#ff9a3c;color:#3b2109;font-weight:900}#s{color:#bdd0e7}</style></head><body><main class="wrap"><div id="stage" class="stage"></div><div class="bar"><button id="go">TIẾN QUÂN</button><span id="s" role="status">Đang tải trận thật…</span></div></main>
<script src="/js/phaser.min.js"></script><script src="/js/night-raid-rules.js"></script><script src="/js/night-raid-choreo.js"></script><script src="/js/castle-skins.js"></script><script src="/js/night-raid-art.js"></script><script src="/js/night-raid-phaser.js"></script><script>
const target=NightRaidRules.trainingTarget(8);target.attackerDamage=target.defense+70;target.attackerSoldiers=6;
const status=document.getElementById('s'),battle=new NightRaidPhaser.AutoBattle(document.getElementById('stage'),target,{pet:{name:'Milo',breed:'Corgi',level:34,atlas:'small',cell:3},onUpdate:s=>status.textContent=s.status==='ready'?'Sẵn sàng':s.status==='fighting'?'Đang giao chiến':s.status==='won'?'Chiến thắng':'Thất bại',onFinish:s=>status.textContent='Kết thúc: '+s.status});
battle.start();document.getElementById('go').onclick=()=>battle.charge();
</script></body></html>
