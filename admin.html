<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FlashLingo — Admin</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --line:#e3e8f0; --ink:#1c2333; --muted:#68748c; --brand:#1cb0f6; --green:#2ea44f; --amber:#ff9600; --red:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  a { color: var(--brand); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }

  /* Login */
  .login { max-width: 360px; margin: 12vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:0 8px 30px rgba(20,30,60,.08); }
  .login h1 { font-size:20px; margin:0 0 4px; }
  .login p { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .login label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 6px; }
  .login input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .login input:focus { outline:none; border-color:var(--brand); }
  .btn { display:inline-block; border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-primary { background:var(--brand); color:#fff; width:100%; margin-top:18px; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .err { color:var(--red); font-size:13px; font-weight:600; margin-top:10px; min-height:18px; }

  /* Dashboard */
  header.bar { display:flex; align-items:center; justify-content:space-between; gap:10px;
               flex-wrap:wrap; margin-bottom:16px; }
  header.bar .bar-actions { display:flex; gap:8px; margin-left:auto; }
  header.bar h1 { font-size:20px; margin:0; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-width:120px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 4px; margin-bottom:16px; overflow:hidden; }
  .card h2 { font-size:14px; margin:14px 14px 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 14px; border-top:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover { background:#f7f9fd; }
  tr.selected { background:#eaf6ff; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.admin { background:#efeaff; color:#7c3aed; }
  .pill.user { background:#eef2f7; color:#68748c; }
  .pill.kind-exam { background:#e6f0ff; color:#1c5fd6; }
  .pill.kind-lesson { background:#e7f7ec; color:#1f9d55; }
  .pill.kind-review { background:#fff3e0; color:#c47700; }
  .pill.kind-grammar { background:#efeaff; color:#7c3aed; }
  .pill.kind-phrases { background:#e9f6fe; color:#1591c9; }
  .pill.kind-wordform { background:#fff0e6; color:#c2560a; }
  .pill.kind-rewrite { background:#f3e8ff; color:#7c3aed; }
  .pill.kind-collocation { background:#e0f2fe; color:#0369a1; }
  .pill.kind-verbs { background:#fdeef2; color:#d6407a; }
  .pill.kind-math { background:#fff7e0; color:#b26a00; }
  .pill.kind-battle { background:#eef2f7; color:#586074; }
  .pct-good { color:var(--green); font-weight:700; }
  .pct-mid { color:var(--amber); font-weight:700; }
  .pct-low { color:var(--red); font-weight:700; }
  .muted { color:var(--muted); }
  .empty { padding:26px 14px; text-align:center; color:var(--muted); }
  .toolbar { display:flex; align-items:center; gap:8px; margin:8px 14px; flex-wrap:wrap; }
  .toolbar .who { font-weight:700; }
  .keep { display:flex; align-items:center; gap:8px; margin-top:16px; font-size:13px; color:var(--ink); cursor:pointer; }
  .keep input { width:16px; height:16px; accent-color:var(--brand); cursor:pointer; }

  /* ---- users table ---- */
  .tools { display:flex; align-items:center; gap:10px; margin:10px 14px 4px; flex-wrap:wrap; }
  .search { flex:1; min-width:180px; position:relative; }
  .search input { width:100%; padding:9px 12px 9px 32px; border:1px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit; }
  .search input:focus { outline:none; border-color:var(--brand); }
  .search::before { content:"🔎"; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.6; }
  .count { color:var(--muted); font-size:12px; }

  #usersTable th.sortable { cursor:pointer; user-select:none; }
  #usersTable th.sortable:hover { color:var(--ink); }
  #usersTable th .arrow { opacity:.35; font-size:9px; }
  #usersTable th.sorted .arrow { opacity:1; color:var(--brand); }
  #usersTable td { vertical-align:middle; }
  .th-short { display:none; }

  .who-cell { display:flex; align-items:center; gap:10px; }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
            font-weight:800; font-size:13px; color:#fff; background:var(--brand); flex:none; }
  .avatar.admin { background:#7c3aed; }
  .who-name { font-weight:700; }
  .who-sub { font-size:11px; color:var(--muted); }

  /* Numbers read as a column of digits, not prose. */
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  /* Named .meter, NOT .bar: <header class="bar"> already exists, and a bare
     .bar rule styled the page header as a 4px blue strip 24px tall with its
     buttons spilling over the stats below. A generic class name in a single
     stylesheet is how that happens. */
  .meter { height:4px; border-radius:2px; background:var(--brand); opacity:.55; margin:3px 0 0 auto; }

  .pill.on   { background:#e7f7ec; color:#1f7a3f; }
  .pill.off  { background:#eef2f7; color:#68748c; }
  .pill.dead { background:#fdecec; color:#b42318; }

  tr.disabled td { opacity:.55; }
  tr.disabled .who-name { text-decoration:line-through; }

  .row-actions { display:flex; gap:6px; justify-content:flex-end; }
  .mini { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 9px;
          font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink); white-space:nowrap; }
  .mini:hover { background:#f7f9fd; }
  .mini:disabled { opacity:.5; cursor:default; }
  .mini.on { background:#e7f7ec; border-color:#bfe6cc; color:#1f7a3f; }
  .mini.danger { color:#b42318; border-color:#f3c6c2; }
  .mini.danger:hover { background:#fdecec; }
  .mini.revive { color:#1f7a3f; border-color:#bfe6cc; }

  @media (max-width: 720px) { th.hide-sm, td.hide-sm { display:none; } }

  /* ---- phones: stay a TABLE, but fit ----
     A card layout was tried and reverted: cards make one user easy to read and
     several users impossible to COMPARE, which is the whole reason to look at
     this screen. So the table stays, and everything else gives way instead —
     smaller type, tighter cells, icon-only buttons, and a user column that
     stays put while the rest scrolls.
     Measured on an iPhone 16 (393x852): 577px of table in a 351px box before,
     fitting after. */
  .sort-mobile { display:none; }
  @media (max-width: 640px) {
    .sort-mobile { display:block; padding:8px 10px; border:1px solid var(--line);
                   border-radius:10px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); }
    /* Two columns give way, and only these two, because the row already says
       both: a disabled account is faded, struck through and offers Enable
       instead of Disable, and the bot state is the toggle's own colour. The
       numbers an admin actually compares — activity, exams, last seen — all
       stay. */
    th.hide-xs, td.hide-xs { display:none; }
    .who-sub { display:none; }            /* the #id is not what you scan for */
    .dev { margin-left:5px; font-size:11px; }
    /* The last few pixels come from the page gutter rather than from the
       content: squeezing the cells further would start costing legibility. */
    .wrap { padding-inline: 10px; }
    #usersTable { font-size:12.5px; }
    #usersTable th, #usersTable td { padding:8px 4px; }
    .th-full { display:none; }
    .th-short { display:inline; }
    /* One long name would otherwise set the width of the whole column. */
    .who-name { display:inline-block; max-width:76px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
    .who-cell { gap:6px; }
    #usersTable th { font-size:10px; letter-spacing:0; }
    .avatar { width:24px; height:24px; font-size:10.5px; }
    .who-sub { font-size:10px; }
    .pill { padding:2px 6px; font-size:10px; }

    /* The buttons keep their icon and drop the word. Three labelled buttons
       need ~220px of a 351px screen, which is what pushed them off-screen. */
    .mini .lbl { display:none; }
    .mini { padding:0; width:34px; height:34px; display:grid; place-items:center; font-size:15px; }
    .row-actions { gap:4px; }

    /* Scrolling right must not lose track of WHOSE row you are reading. */
    #usersTable th:first-child, #usersTable td:first-child {
      position:sticky; left:0; z-index:1; background:var(--card);
    }
    #usersTable tr.selected td:first-child { background:#eaf6ff; }
    .stat { flex:1 1 100px; }
    header.bar h1 { font-size:18px; }
  }
  #dash { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Login -->
  <div id="login" class="login">
    <h1>🎯 FlashLingo Admin</h1>
    <p>Sign in with the admin account.</p>
    <label>Username</label>
    <input id="u" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <label class="keep"><input type="checkbox" id="keepMe" checked> Keep me signed in on this device</label>
    <button class="btn btn-primary" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- Dashboard -->
  <div id="dash">
    <header class="bar">
      <h1>🎯 FlashLingo Admin</h1>
      <div class="bar-actions">
        <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </header>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>Users</h2>
      <div class="tools">
        <div class="search"><input id="userSearch" placeholder="Search by name…" autocomplete="off" spellcheck="false"></div>
        <!-- The sortable column headers are hidden in card layout, so phones
             get this instead. Both write to the same _sort state. -->
        <select class="sort-mobile" id="sortSel" aria-label="Sort users by">
          <option value="last_activity">Recently seen</option>
          <option value="total_count">Most activity</option>
          <option value="exam_count">Most exams</option>
          <option value="username">Name A–Z</option>
          <option value="created_at">Newest</option>
        </select>
        <span class="count" id="userCount"></span>
      </div>
      <div class="scroll"><table id="usersTable">
        <thead><tr>
          <th class="sortable" data-sort="username">User <span class="arrow">▼</span></th>
          <th class="sortable" data-sort="total_count"><span class="th-full">Activity</span><span class="th-short">Acts</span> <span class="arrow">▼</span></th>
          <th class="sortable hide-sm" data-sort="exam_count">Exams <span class="arrow">▼</span></th>
          <th class="sortable" data-sort="last_activity"><span class="th-full">Last seen</span><span class="th-short">Seen</span> <span class="arrow">▼</span></th>
          <th class="sortable hide-sm" data-sort="created_at">Joined <span class="arrow">▼</span></th>
          <th class="hide-xs">Status</th>
          <th style="text-align:right">Actions</th>
        </tr></thead>
        <tbody id="usersBody"></tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0 6px 0 10px;">Activity history</h2>
        <span class="who" id="whoLabel">All users · last 30 days</span>
        <button class="btn btn-ghost" id="allBtn" style="margin-left:auto;">Show all users</button>
      </div>
      <div class="scroll"><table id="attemptsTable">
        <thead><tr><th>When</th><th>User</th><th>Type</th><th>Activity</th><th>Score</th><th>%</th><th>Time</th></tr></thead>
        <tbody id="attemptsBody"></tbody>
      </table></div>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'eng_admin_token';

// "Keep me signed in" decides WHERE the token lives, not whether it is stored:
//   localStorage   → survives closing the browser (the default)
//   sessionStorage → gone when the tab closes, for a shared computer
// Read both on load, because the choice may have been different last time.
function readToken() {
  try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || null; }
  catch (e) { return null; }
}
function writeToken(t, keep) {
  try {
    // Always clear the other one, or logging out of a "keep me" session would
    // leave a token behind in the store nobody thought to clear.
    localStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(TOKEN_KEY);
    if (t) (keep ? localStorage : sessionStorage).setItem(TOKEN_KEY, t);
  } catch (e) {}
}
let token = readToken();

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pctClass(p){ return p>=75?'pct-good':p>=50?'pct-mid':'pct-low'; }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s.replace(' ','T')+'Z'); return isNaN(d)?s:d.toLocaleString(); }
function fmtTime(sec){ if(sec==null) return '—'; const m=Math.floor(sec/60), r=sec%60; return m+':'+String(r).padStart(2,'0'); }

async function api(path, opts){
  opts = opts || {};
  const headers = { 'Authorization': 'Bearer '+token };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch('/api/'+path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status===401 || res.status===403){ logout(); throw new Error('unauth'); }
  const data = await res.json().catch(()=>null);
  if (!res.ok) throw new Error((data && data.error) || ('HTTP '+res.status));
  return data;
}

async function doLogin(){
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, passcode:p}) });
    const data = await res.json();
    if (!res.ok){ errEl.textContent = data.error || 'Login failed'; return; }
    if (data.user.role !== 'admin'){ errEl.textContent = 'This account is not an admin.'; return; }
    token = data.token;
    writeToken(token, document.getElementById('keepMe').checked);
    showDash();
  } catch(e){ errEl.textContent = 'Network error'; }
}

function logout(){
  token = null;
  writeToken(null, false);
  document.getElementById('dash').style.display='none';
  document.getElementById('login').style.display='block';
}

let _selectedUser = null;

const KIND_LABEL = { exam:'📝 Exam', lesson:'📚 Lesson', review:'🔁 Review', grammar:'🎓 Grammar', phrases:'🔗 Phrases', collocation:'🧩 Collocation', wordform:'🔤 Word form', rewrite:'✍️ Rewrite', verbs:'⚡ Verbs', math:'🔢 Toán', battle:'⚔️ Battle' };
function kindPill(k){ return `<span class="pill kind-${esc(k)}">${KIND_LABEL[k]||esc(k)}</span>`; }

// ---- users table ----------------------------------------------------------
let _users = [];
let _sort = { key: 'last_activity', dir: -1 };   // most recently seen first
let _filter = '';

// "3 hours ago" answers the question an admin actually has; the exact stamp
// stays on hover for when it matters.
function relTime(s){
  if (!s) return '—';
  const d = new Date(String(s).replace(' ','T')+'Z');
  if (isNaN(d)) return s;
  const secs = Math.round((Date.now() - d.getTime()) / 1000);
  if (secs < 60) return 'just now';
  const mins = Math.round(secs/60);   if (mins < 60) return mins + 'm ago';
  const hrs  = Math.round(mins/60);   if (hrs  < 24) return hrs  + 'h ago';
  const days = Math.round(hrs/24);    if (days < 30) return days + 'd ago';
  const mos  = Math.round(days/30);   if (mos  < 12) return mos  + 'mo ago';
  return Math.round(mos/12) + 'y ago';
}
// Vietnamese names are full of diacritics, so a literal match makes the box
// useless: typing "bo" would never find "Bố ck", and "vk" never "Vk shidou".
// Fold accents on both sides and compare the bare letters. đ/Đ decompose to
// nothing under NFD, so they are mapped by hand.
function fold(s){
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .toLowerCase();
}

function initials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  const s = (parts[0]||'?')[0] + (parts.length > 1 ? parts[parts.length-1][0] : '');
  return s.toUpperCase();
}

async function loadUsers(){
  const { users } = await api('admin/users');
  _users = users || [];
  const totalActs = _users.reduce((s,u)=>s+(u.total_count||0),0);
  const totalExams = _users.reduce((s,u)=>s+(u.exam_count||0),0);
  const off = _users.filter(u=>u.disabled).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${_users.length}</b><span>Users${off?` · ${off} disabled`:''}</span></div>`+
    `<div class="stat"><b>${totalActs}</b><span>Activities (30d)</span></div>`+
    `<div class="stat"><b>${totalExams}</b><span>Exam attempts</span></div>`;
  renderUsers();
}

function renderUsers(){
  const body = document.getElementById('usersBody');
  const q = fold(_filter.trim());
  const rows = _users.filter(u => !q || fold(u.username).includes(q));

  const { key, dir } = _sort;
  rows.sort((a,b)=>{
    let x = a[key], y = b[key];
    if (key === 'username') return String(x).localeCompare(String(y), 'vi') * dir;
    x = (x == null || x === '') ? (typeof y === 'number' ? -1 : '') : x;
    y = (y == null || y === '') ? (typeof x === 'number' ? -1 : '') : y;
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });

  document.getElementById('userCount').textContent =
    rows.length === _users.length ? `${_users.length} users` : `${rows.length} of ${_users.length}`;
  // Header clicks and the phone dropdown drive the same state, so neither can
  // show an order the other is not in.
  const sel = document.getElementById('sortSel');
  if (sel && sel.value !== key) sel.value = key;
  document.querySelectorAll('#usersTable th.sortable').forEach(th=>{
    const on = th.getAttribute('data-sort') === key;
    th.classList.toggle('sorted', on);
    th.querySelector('.arrow').textContent = on ? (dir === 1 ? '▲' : '▼') : '▼';
  });

  if (!rows.length){
    body.innerHTML = `<tr><td colspan="7" class="empty">${q ? 'No user matches “'+esc(q)+'”.' : 'No users yet.'}</td></tr>`;
    return;
  }
  const busiest = Math.max(1, ...rows.map(u=>u.total_count||0));
  body.innerHTML = rows.map(u=>{
    const pct = Math.round((u.total_count||0) / busiest * 100);
    return `<tr class="clickable ${u.disabled?'disabled':''}" data-uid="${u.id}" data-name="${esc(u.username)}">
      <td>
        <div class="who-cell">
          <span class="avatar ${u.role==='admin'?'admin':''}">${esc(initials(u.username))}</span>
          <span>
            <span class="who-name">${esc(u.username)}</span>
            <span class="who-sub">${u.role==='admin'?'admin · ':''}#${u.id}</span>${u.has_device?'<span class="dev" title="Holds a slot on a device">📱</span>':''}
          </span>
        </div>
      </td>
      <td class="num"><b>${u.total_count||0}</b><div class="meter" style="width:${pct}%"></div></td>
      <td class="num hide-sm">${u.exam_count||0}</td>
      <td class="muted" title="${esc(fmtDate(u.last_activity))}">${relTime(u.last_activity)}</td>
      <td class="muted hide-sm" title="${esc(fmtDate(u.created_at))}">${relTime(u.created_at)}</td>
      <td class="hide-xs">${u.disabled
            ? '<span class="pill dead">Disabled</span>'
            : `<span class="pill ${u.allow_bot?'on':'off'}">${u.allow_bot?'🤖 Bot on':'Active'}</span>`}</td>
      <td>
        <div class="row-actions">
          <button class="mini bot-toggle ${u.allow_bot?'on':''}" data-uid="${u.id}"
                  aria-label="Bot practice for ${esc(u.username)}: currently ${u.allow_bot?'on':'off'}"
                  title="Practice against a bot: unlimited, 20 shots, no rewards">🤖<span class="lbl"> ${u.allow_bot?'On':'Off'}</span></button>
          ${u.has_device ? `<button class="mini act-clear" data-uid="${u.id}"
                  aria-label="Free the device slot held by ${esc(u.username)}"
                  title="Free this account's slot on its device (max 2 accounts per device)">📱<span class="lbl"> Free slot</span></button>` : ''}
          ${u.role === 'admin' ? '' : (u.disabled
            ? `<button class="mini revive act-enable" data-uid="${u.id}" aria-label="Enable ${esc(u.username)}">↩︎<span class="lbl"> Enable</span></button>`
            : `<button class="mini danger act-disable" data-uid="${u.id}" data-name="${esc(u.username)}"
                  aria-label="Disable ${esc(u.username)}"
                  title="Sign this account out everywhere and block sign-in. Nothing is deleted.">🚫<span class="lbl"> Disable</span></button>`)}
        </div>
      </td>
    </tr>`;
  }).join('');

  // Buttons live inside a clickable row, so each must stop the row selecting.
  const act = (sel, run) => body.querySelectorAll(sel).forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      btn.disabled = true;
      try { await run(btn); await loadUsers(); }
      catch (err) { alert('Could not do that: ' + (err && err.message ? err.message : err)); btn.disabled = false; }
    };
  });
  act('.bot-toggle', b => api('admin/user-flags', { method:'POST',
        body:{ userId: Number(b.dataset.uid), allowBot: !b.classList.contains('on') } }));
  act('.act-clear', b => api('admin/user-flags', { method:'POST',
        body:{ userId: Number(b.dataset.uid), clearDevice: true } }));
  act('.act-enable', b => api('admin/user-flags', { method:'POST',
        body:{ userId: Number(b.dataset.uid), disabled: false } }));
  act('.act-disable', b => {
    // Disabling signs a child out of every device at once. Worth one question.
    if (!confirm('Disable “' + b.dataset.name + '”?\n\nThey will be signed out everywhere and cannot sign in. Nothing is deleted — you can enable them again at any time.')) {
      return Promise.reject(new Error('cancelled'));
    }
    return api('admin/user-flags', { method:'POST', body:{ userId: Number(b.dataset.uid), disabled: true } });
  });

  body.querySelectorAll('tr.clickable').forEach(tr=>{
    tr.onclick = ()=>{
      body.querySelectorAll('tr').forEach(r=>r.classList.remove('selected'));
      tr.classList.add('selected');
      loadActivity(tr.getAttribute('data-uid'), tr.getAttribute('data-name'));
    };
  });
}

async function loadActivity(userId, name){
  _selectedUser = userId || null;
  document.getElementById('whoLabel').textContent = userId ? ('User: '+name) : 'All users · last 30 days';
  const q = userId ? ('admin/activity?user_id='+encodeURIComponent(userId)) : 'admin/activity';
  const { activity } = await api(q);
  const body = document.getElementById('attemptsBody');
  if (!activity.length){ body.innerHTML = `<tr><td colspan="7" class="empty">No activity yet.</td></tr>`; return; }
  body.innerHTML = activity.map(a=>{
    const hasScore = (a.total!=null && a.total>0);
    const pct = hasScore ? Math.round(a.score/a.total*100) : null;
    return `<tr>
      <td class="muted">${fmtDate(a.created_at)}</td>
      <td><b>${esc(a.username)}</b></td>
      <td>${kindPill(a.kind)}</td>
      <td>${esc(a.title||a.ref||'—')}</td>
      <td>${hasScore ? (a.score+'/'+a.total) : '—'}</td>
      <td>${pct!=null ? `<span class="${pctClass(pct)}">${pct}%</span>` : '—'}</td>
      <td class="muted">${a.kind==='exam' ? fmtTime(a.time_spent_sec) : '—'}</td>
    </tr>`;
  }).join('');
}

function showDash(){
  document.getElementById('login').style.display='none';
  document.getElementById('dash').style.display='block';
  loadUsers().catch(()=>{});
  loadActivity(null, null).catch(()=>{});
}

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').onclick = logout;
document.getElementById('refreshBtn').onclick = ()=>{ loadUsers().catch(()=>{}); loadActivity(_selectedUser, document.querySelector('tr.selected b')?.textContent).catch(()=>{}); };
document.getElementById('userSearch').addEventListener('input', e=>{ _filter = e.target.value; renderUsers(); });
document.getElementById('sortSel').addEventListener('change', e=>{
  const key = e.target.value;
  _sort = { key, dir: key === 'username' ? 1 : -1 };
  renderUsers();
});
document.querySelectorAll('#usersTable th.sortable').forEach(th=>{
  th.onclick = ()=>{
    const key = th.getAttribute('data-sort');
    // Same column toggles direction; a new column starts on its natural one —
    // names A-Z, everything else biggest/most-recent first.
    if (_sort.key === key) _sort.dir *= -1;
    else _sort = { key, dir: key === 'username' ? 1 : -1 };
    renderUsers();
  };
});
document.getElementById('allBtn').onclick = ()=>{ document.querySelectorAll('#usersBody tr').forEach(r=>r.classList.remove('selected')); loadActivity(null,null); };

// Auto-enter dashboard if we already have a token (verify by loading).
if (token){ showDash(); }
</script>
